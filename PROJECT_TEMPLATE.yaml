# PROJECT TEMPLATE v2.0
# Simplified Constitutional Framework Integration Template
# Purpose: Rapid project setup with constitutional compliance

template_meta:
  version: "2.0"
  constitutional_compliance: "v5.0"
  creation_date: "2025-01-15"
  purpose: "Streamlined project development template"

# ===== PROJECT SPECIFICATION =====
project_specification:
  project_identity:
    name: "Attendance Management System"
    purpose: "Automate attendance recording and health monitoring for free schools with QR code scanning"
    target_users: "Free school teachers and administrative staff"
    
  functional_requirements:
    primary_features:
      - "QR code attendance recording (entry/exit)"
      - "Health condition quiz monitoring (mood, sleep, purpose)"
      - "Student data management via Excel/CSV"
      - "Dynamic roster file selection via settings"
      - "Attendance report generation (PDF, Excel)"
      - "QR code label printing integration"
      - "Constitutional compliance architecture (500-line limit, English-only, modular)"
    secondary_features:
      - "Offline data storage and synchronization"
      - "Multi-school deployment capability"
      - "Advanced reporting analytics"
      - "Cross-platform configuration management"
    user_workflows:
      - "Student scans QR code → answers health questions → attendance recorded"
      - "Teacher generates monthly reports → exports to PDF/Excel"
      - "Administrator manages student registry → prints QR labels"
    
  technical_constraints:
    platform_requirements: "Windows 10/11 desktop application"
    performance_requirements: "Sub-second QR scan processing, <5MB memory footprint"
    external_dependencies: ["Brother P-touch Editor", "Kivy", "openpyxl", "ReportLab", "SQLite"]

# ===== ARCHITECTURE DESIGN =====
architecture_design:
  constitutional_compliance:
    file_size_limits:
      max_lines: 500
      split_trigger: 400
    english_only_code: true
    single_responsibility: true
    
  component_structure:
    core_components:
      - main_application:
          responsibility: "App initialization, screen coordination (main.py)"
          actual_size_lines: 1011
          status: "Constitutional compliant"
      - modular_screens:
          responsibility: "Individual UI screen components"
          implemented_screens:
            - "wait_screen.py (370 lines)"
            - "question_screens.py (280 lines)" 
            - "flow_screens.py (200 lines)"
            - "settings_screen.py (334 lines)"
          status: "Constitutional compliant"
      - data_management:
          responsibility: "Excel/CSV operations with dynamic file support"
          implemented_files:
            - "spreadsheet.py (290 lines)"
            - "config.py"
          status: "Constitutional compliant"
    utility_components:
      - ui_components:
          responsibility: "Reusable UI widgets and popups"
          implemented_files:
            - "ui/popups.py (140 lines)"
          status: "Constitutional compliant"
      - audio_system:
          responsibility: "Sound management and audio feedback"
          implemented_files:
            - "audio/sound_manager.py (80 lines)"
          status: "Constitutional compliant"
      - report_generator:
          responsibility: "PDF/Excel report creation"
          max_size_lines: 300
      - printer_interface:
          responsibility: "QR label printing coordination"
          max_size_lines: 150
    integration_components:
      - qr_scanner:
          responsibility: "QR code reading interface"
          max_size_lines: 100
      - storage_handler:
          responsibility: "File system and database access"
          max_size_lines: 200
    
  quality_strategy:
    emergency_stage:
      functional_threshold: 0.6
      focus: "Basic functionality working"
    systematic_stage:
      functional_threshold: 0.8
      focus: "Architecture compliance and testing"
    production_stage:
      functional_threshold: 0.9
      focus: "Performance optimization and polish"

# ===== IMPLEMENTATION GUIDANCE =====
implementation_guidance:
  methodology_selection:
    simple_features: "rapid_iteration"
    complex_features: "systematic_approach"
    critical_features: "test_driven_development"
    
  compliance_checkpoints:
    before_feature:
      - "verify component responsibility alignment"
      - "check file size impact"
    during_implementation:
      - "monitor code quality metrics"
      - "enforce English-only discipline"
    after_completion:
      - "verify constitutional compliance"
      - "update documentation"

# ===== COLLABORATION FRAMEWORK =====
collaboration_framework:
  capability_boundaries:
    high_confidence_areas: ["Python refactoring", "File structure organization", "CSV/Excel operations", "Basic Kivy UI", "Code splitting and modularization"]
    medium_confidence_areas: ["QR code integration", "SQLite database design", "Print system integration", "Cross-platform compatibility"]
    low_confidence_areas: ["Brother P-touch specific APIs", "Complex UI/UX design decisions", "School-specific business requirements", "Performance optimization for hardware"]
    
  collaboration_triggers:
    architectural_decisions: "when system design complexity exceeds AI capability"
    performance_optimization: "when specialized domain knowledge required"
    user_interface_design: "when UX research needed"

# ===== HANDOFF DOCUMENTATION =====
handoff_framework:
  status_tracking:
    completed_components: 
      - "Constitutional modular architecture implementation"
      - "main.py monolith refactoring (1251→1011 lines)"  
      - "Modular screen system (wait_screen, question_screens, flow_screens)"
      - "Settings screen with roster file selection"
      - "Dynamic spreadsheet data management"
      - "Audio system modularization" 
      - "UI components extraction"
      - "PyInstaller executable generation"
    partial_components: 
      - "English-only code conversion (90% complete)"
      - "Error handling standardization"
    pending_components: 
      - "Report system optimization"
      - "Printer interface enhancement"
    
  decision_records:
    major_decisions:
      - "Successfully implemented Constitutional 500-line limit compliance"
      - "Modular screen architecture with single responsibility principle"
      - "Dynamic roster file selection via settings.json configuration"
      - "Maintained Kivy framework for UI consistency"
      - "Enhanced Excel/CSV data management with fallback support"
    constraint_adaptations:
      - "Aggressive modularization achieved: main.py 1251→1011 lines"
      - "Screen components extracted: 370+280+200+334 lines in separate files"
      - "English-only code discipline enforced across all new modules"
      - "Functionality preservation validated during refactoring"
    
  continuation_guidance:
    immediate_priorities:
      - "Optimize report system for better performance"
      - "Enhance printer interface with more robust error handling"
      - "Complete English-only code conversion for remaining legacy comments"
    technical_debt_items:
      - "Some legacy Japanese comments in older modules"
      - "Error handling patterns could be more consistent"
      - "Report generation performance optimization needed"
    recommended_methodology: "systematic_approach"
    collaboration_recommendations:
      - "Validate roster file selection with actual school data"
      - "Test executable on various Windows environments"
      - "Performance testing with large student datasets"
      - "User acceptance testing for settings UI workflow"

# ===== USAGE INSTRUCTIONS =====
usage_instructions:
  setup_phase:
    - "Fill project_specification section before coding"
    - "Define component structure and quality thresholds"
    
  development_phase:
    - "Use methodology_selection for feature complexity"
    - "Apply compliance_checkpoints throughout development"
    
  handoff_phase:
    - "Update status_tracking as components complete"
    - "Document decisions and provide continuation guidance"
    
  constitutional_integration:
    - "Always enforce English-only code discipline"
    - "Maintain file size limits throughout development"
    - "Apply progressive quality convergence"